name: TrendEmpire Bot — Daily Video Pipeline

on:
  # 16:00 UTC = 18:00 SAST (UTC+2)
  schedule:
    - cron: "0 16 * * *"

  # Manual trigger from GitHub → Actions tab (replaces a webhook)
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "manual test"

jobs:
  run-pipeline:
    name: Generate & Upload Daily Video
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trendempire/requirements.txt

      # ── 3. System packages ───────────────────────────────────────────────────
      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' \
            /etc/ImageMagick-6/policy.xml

      # ── 4. Python packages ───────────────────────────────────────────────────
      - name: Install Python requirements
        run: pip install -r trendempire/requirements.txt

      # ── 5. Output and log directories ───────────────────────────────────────
      - name: Create output directories
        run: |
          mkdir -p trendempire/output/images \
                   trendempire/output/repurposed/tiktok \
                   trendempire/output/repurposed/reels \
                   trendempire/output/repurposed/shorts \
                   trendempire/output/repurposed/spotify \
                   trendempire/logs

      # ── 6. Write .env from GitHub Secrets ───────────────────────────────────
      # IMPORTANT: no leading spaces — each line must start at column 0 inside
      # the heredoc or python-dotenv will read spaces as part of the key name.
      # YOUTUBE_CLIENT_SECRET_PATH uses just the filename because Python runs
      # with working-directory: trendempire so CWD is already trendempire/.
      - name: Write .env from secrets
        run: |
          cat > trendempire/.env <<EOF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_SECRET_PATH=client_secret.json
          PREFERRED_NICHE=${{ vars.PREFERRED_NICHE || 'finance south africa' }}
          TTS_VOICE=${{ vars.TTS_VOICE || 'en-ZA-LeahNeural' }}
          TIKTOK_ACCESS_TOKEN=${{ secrets.TIKTOK_ACCESS_TOKEN }}
          META_PAGE_ACCESS_TOKEN=${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID=${{ secrets.META_FACEBOOK_PAGE_ID }}
          META_INSTAGRAM_ACCOUNT_ID=${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET=${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET=${{ secrets.TWITTER_ACCESS_SECRET }}
          PINTEREST_ACCESS_TOKEN=${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID=${{ secrets.PINTEREST_BOARD_ID }}
          BUZZSPROUT_PODCAST_ID=${{ secrets.BUZZSPROUT_PODCAST_ID }}
          BUZZSPROUT_API_KEY=${{ secrets.BUZZSPROUT_API_KEY }}
          EOF
          # Strip any accidental leading whitespace from each line
          sed -i 's/^[[:space:]]*//' trendempire/.env

      # ── 7. Restore YouTube client_secret.json ───────────────────────────────
      # How to create this secret (run once on your laptop):
      #   base64 -w 0 client_secret.json   →  copy output → secret YOUTUBE_CLIENT_SECRET_B64
      - name: Restore YouTube client_secret.json
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}" | base64 -d > trendempire/client_secret.json

      # ── 8. Restore YouTube token.pickle ────────────────────────────────────
      # How to create this secret (run once on your laptop after browser login):
      #   base64 -w 0 token.pickle   →  copy output → secret YOUTUBE_TOKEN_PICKLE_B64
      # After each Actions run, download the youtube-token artifact and re-upload
      # as this secret to keep the token fresh.
      - name: Restore YouTube token.pickle
        if: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 != '' }}
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}" | base64 -d > trendempire/token.pickle

      # ── 9. Run the pipeline ─────────────────────────────────────────────────
      - name: Run TrendEmpire pipeline
        working-directory: trendempire
        run: python run_pipeline.py

      # ── 10. Save refreshed token.pickle as artifact ─────────────────────────
      # Download this after each run → re-encode → update YOUTUBE_TOKEN_PICKLE_B64
      # (YouTube tokens expire; keeping the secret fresh prevents re-auth prompts)
      - name: Upload refreshed YouTube token
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-token
          path: trendempire/token.pickle
          retention-days: 7
          if-no-files-found: ignore

      # ── 11. Upload logs ──────────────────────────────────────────────────────
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: |
            trendempire/logs/bot.log
            trendempire/logs/last_run.json
          retention-days: 14
          if-no-files-found: ignore

      # ── 12. Telegram — success ───────────────────────────────────────────────
      - name: Notify Telegram on success
        if: success()
        run: |
          STATUS=$(cat trendempire/logs/last_run.json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('youtube_url','(no URL yet)'))" \
            2>/dev/null || echo "(check logs)")
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=✅ *TrendEmpire Bot* — Video Published!
          📺 $STATUS
          🏃 Run #${{ github.run_number }}
          🔍 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ── 13. Telegram — failure ───────────────────────────────────────────────
      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=❌ *TrendEmpire Bot* — Pipeline FAILED
          🏃 Run #${{ github.run_number }}
          🔍 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
